name: Amplify CI

on:
  push:
    branches: [main]
    paths:
      - 'amplify/**'
      - 'amplify.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/amplify-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'amplify/**'
      - 'amplify.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/amplify-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # `npm ci` is unusable in this tree: @aws-amplify/backend pulls
      # @aws-amplify/data-construct and @aws-amplify/graphql-api-construct,
      # whose bundled nested deps npm reports as "Missing from lock file" even
      # straight after a clean `npm install`. `npm install` + the drift check
      # below gives the same reproducibility guarantee.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lockfile is in sync
        run: git diff --exit-code package-lock.json

      - name: Type check infra
        run: npx tsc --noEmit -p amplify

      - name: Run infra tests
        run: npm test
