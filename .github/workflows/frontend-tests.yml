name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      # The generated event types derive from the runtime's pydantic models —
      # a contract change must re-run the frontend checks.
      - 'runtime/bridge/events.py'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - 'runtime/bridge/events.py'
      - '.github/workflows/frontend-tests.yml'

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: Prettier check
        working-directory: web
        run: npm run format:check

      - name: Type check
        working-directory: web
        run: npm run type-check

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run tests
        working-directory: web
        run: npm test -- --run
