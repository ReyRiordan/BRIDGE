# One path setup for every pytest run: runtime/ goes ahead of site-packages
# before collection, so voice_kit and the unpackaged bridge/ always import from
# the live tree, and a bare `pytest` collects the API and runtime suites
# together. scripts/visuals/tests is deliberately absent — its own CI job and
# venv run it explicitly.
[pytest]
pythonpath = runtime
testpaths = api/tests runtime/tests
